name: Bug report
description: Report a reproducible bug without exposing personal vehicle information
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform / Flutter version
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
